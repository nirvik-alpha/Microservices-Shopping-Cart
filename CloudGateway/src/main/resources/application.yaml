server:
  port:9090

spring:
  application:
    name: API-GATEWAY
  config:
    import: configserver:http://${CONFIG_SERVER_URL:localhost}:9296
  cloud:
    gateway:
      routes:
       - id : ORDER-SERVICE
         url: lb://ORDER-SERVICE
         predicates:
           - Path=/order/**
         filters:
           - name: CircuitBreaker
             args:
               name: ORDER-SERVICE
               fallbackuri: forward:/orderServiceFallBack
       - id: PAYMENT-SERVICE
         url: lb://PAYMENT-SERVICE
         predicates:
           - Path=/payment/**
         filters:
           - name: CircuitBreaker
             args:
               name: PAYMENT-SERVICE
               fallbackuri: forward:/paymentServiceFallBack
       - id : PRODUCT-SERVICE
         url: lb://PRODUCT-SERVICE
         predicates:
           - Path=/product/**
         filters:
           - name: CircuitBreaker
             args:
               name: PRODUCT-SERVICE
               fallbackuri: forward:/productServiceFallBack